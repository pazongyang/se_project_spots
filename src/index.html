<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Pazong Yang" />
    <meta name="description" content="???" />
    <meta name="keywords" content="HTML, CSS" />
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img id="logo" alt="spot logo" class="header__logo" />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button class="profile__avatar-btn">
              <img
                id="pencilLight"
                class="profile__pencil-icon"
                alt="Pencil icon"
              />
            </button>
            <img
              id="avatar"
              alt="current user's avatar"
              class="profile__avatar"
            />
          </div>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>

            <!--  -->
            <button type="button" class="profile__edit-btn">
              <img
                src="<%=require('./images/pencil.svg')%>"
                class="profile__pencil-icon"
                alt="pencil icon"
              />Edit Profile
            </button>
          </div>
          <button type="button" class="profile__add-btn">
            <img
              src="<%=require('./images/plus.svg')%>"
              class="profile__add-btn-img"
              alt="plus icon"
            />
            New Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button class="card__delete-btn" type="button"></button>
                <img alt="card image" class="card__image" />
                <div class="card__content">
                  <h2 class="card__title">Val Thorens</h2>
                  <button type="button" class="card__like-btn"></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer"><p>2025 &copy; Spots</p></footer>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn">
            <img
              src="<%=require('./images/close-icon.svg')%>"
              alt="close"
              class="modal__close-icon"
            />
          </button>
          <h2 class="modal__title">Edit profile</h2>
          <form class="modal__form" novalidate>
            <label for="profile-name-input" class="modal__label required"
              >Name<input
                id="profile-name-input"
                type="text"
                class="modal__input"
                placeholder="Type your name"
                minlength="2"
                maxlength="40"
                required /><span
                id="profile-name-input-error"
                class="modal__error"
              ></span
            ></label>
            <label for="profile-description-input" class="modal__label" required
              >Description<input
                id="profile-description-input"
                type="text"
                class="modal__input"
                placeholder="Describe yourself"
                minlength="2"
                maxlength="200"
                required /><span
                id="profile-description-input-error"
                class="modal__error"
              ></span
            ></label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn">
            <img
              src="<%=require('./images/close-icon.svg')%>"
              alt="close"
              class="modal__close-icon"
            />
          </button>
          <h2 class="modal__title">New post</h2>
          <form class="modal__form" novalidate>
            <label for="card-image-input" class="modal__label"
              >Image link<input
                id="card-image-input"
                type="url"
                class="modal__input"
                placeholder="Paste a link to the picture"
                required
              /><span id="card-image-input-error" class="modal__error"></span>
            </label>
            <label for="caption-image-input" class="modal__label"
              >Caption<input
                id="caption-image-input"
                type="text"
                class="modal__input"
                placeholder="Type your caption"
                minlength="2"
                maxlength="30"
                required
              /><span
                id="caption-image-input-error"
                class="modal__error"
              ></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>
    </div>
    <div class="modal modal_type_preview" id="preview-modal">
      <div class="modal__image-container">
        <button
          type="button"
          class="modal__close-btn modal__close-btn_type_preview"
        >
          <img
            src="<%=require('./images/close-preview-icon.svg')%>"
            id="closePreviewIcon"
            alt="close button"
          />
        </button>
        <img src="#" alt="" class="modal__image" />
        <p class="modal__caption"></p>
      </div>
    </div>

    <!-- AvatarEditBtn Modal -->
    <div class="modal" id="avatar-modal">
      <div class="modal__container">
        <button type="button" class="modal__close-btn">
          <img
            src="<%=require('./images/close-icon.svg')%>"
            alt="close"
            class="modal__close-icon"
          />
        </button>
        <h2 class="modal__title">Edit profile avatar</h2>
        <form class="modal__form" id="edit-avatar-form" novalidate>
          <label for="profile-avatar-input" class="modal__label required"
            >Profile Picture<input
              id="profile-avatar-input"
              class="modal__input"
              name="avatar"
              placeholder="Paste the link to an image"
              type="url"
              required />

            <span id="profile-avatar-input-error" class="modal__error"></span
          ></label>
          <button type="submit" class="modal__submit-btn">Save</button>
        </form>
      </div>
    </div>

    <!-- -->
    <!-- "modal-delete__close-btn" -->
    <!-- DeleteConfirmation Modal -->

    <!--  -->

    <div class="modal modal-delete" id="delete-confirmation-modal">
      <div class="modal__delete-container">
        <button
          class="modal-delete__close-btn"
          type="button"
          aria-label="close modal"
        >
          <img
            src="<%=require('./images/close-icon.svg')%>"
            alt="close"
            class="modal__delete-icon"
          />
        </button>

        <!--  -->

        <h2 class="modal__delete-title" id="delete-modal-title">
          Are you sure you want to delete this image?
        </h2>

        <form class="modal__form" id="delete-card-form" novalidate>
          <div class="modal__button-group">
            <button
              type="submit"
              class="modal__submit-btn modal__submit-btn_type_danger"
            >
              Delete
            </button>
            <button
              type="button"
              class="modal__cancel-btn"
              id="delete-cancel-btn"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
